stages:
  - build
  - build-noarch
  - deploy

.build-cpp:
  stage: build
  script:
    - conda config --set channel_priority flexible
    - conda mambabuild ./conda/camera --output-folder=dist -c conda-forge --channel=http://bcu-ci.esrf.fr/stable
  artifacts:
    paths:
      - dist

build-linux:
  extends: .build-cpp
  tags:
    - linux

build-win:
  extends: .build-cpp
  script:
    - call conda config --set channel_priority flexible
    - call conda mambabuild ./conda/camera --output-folder=dist -c conda-forge --channel=http://bcu-ci.esrf.fr/stable
  tags:
    - win

build-noarch:
  stage: build-noarch
  script:
    - conda config --set channel_priority flexible
    - conda mambabuild ./conda/tango --output-folder=dist -c conda-forge --channel=http://bcu-ci.esrf.fr/stable
  dependencies:
    - build-linux
    - build-win
  artifacts:
    paths:
      - dist
  tags:
    - linux

deploy-devel:
  stage: deploy
  environment:
    name: devel/$CI_COMMIT_REF_NAME
    url: http://bcu-ci.esrf.fr/devel
  dependencies:
    - build-linux
    - build-win
    - build-noarch
  script:
    - cp -Rf dist/* /conda-devel/
    - flock /conda-devel/.reindex.lock -c "conda index --channeldata /conda-devel/"
  tags:
    - conda
    - linux
  when: manual

deploy-stable:
  stage: deploy
  environment:
    name: production
    url: http://bcu-ci.esrf.fr/stable
  dependencies:
    - build-linux
    - build-win
    - build-noarch
  script:
    - cp -Rf dist/* /conda/
    - flock /conda/.reindex.lock -c "conda index --channeldata /conda/"
  tags:
    - conda
    - linux
  when: manual
